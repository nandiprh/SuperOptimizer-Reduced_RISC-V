# Tokyo Night theme for kitty
# Based on tonybanters/alacritty TokyoNight colorscheme

include current-theme.conf

# Display
font_family      family="JetBrains Mono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Window
window_padding_width 14
hide_window_decorations yes
background_opacity 1.0
background_blur 0

# Cursor
cursor           #c0caf5
cursor_text_color #1a1b26
cursor_trail     3
cursor_trail_decay 0.1 0.4

# Tabs
tab_bar_min_tabs            1
tab_bar_edge                top
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Mouse
mouse_map   click      focus
mouse_map   right      popup
mouse_map   middle     paste

# Misc
allow_remote_control yes
enable_audio_visualization no
term_features xterm-24bit